name: Compilar Dental Scope APK

on:
  push:
    branches:
      - android-apk

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion web
        run: DS_BASE=./ npm run build

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Revisar permisos del APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk

      - name: Analizar APK con ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          set -o pipefail
          clamscan --bytecode-timeout=60000 -i android/app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee clamav-scan.log
          if grep -Ei 'timed out|failed to run|Exceeded time limit' clamav-scan.log; then
            echo "::error::ClamAV no completo todas las comprobaciones"
            exit 1
          fi

      - name: Calcular SHA256 del APK
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dental-Scope-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
